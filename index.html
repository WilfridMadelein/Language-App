<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apprendre les langues</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Apprendre les langues</h1>

</header>



<div class="container">


<!-- MENU GAUCHE -->

<nav class="menu">

<h2>Table des matières</h2>

<div class="menu-columns">


<div class="categories-container">


<h3 class="menu-title">Catégories</h3>

<div id="categories"></div>


</div>



<div class="souscategories-container">


<h3 class="menu-title">Sous-catégories</h3>

<div id="sousCategories"></div>


</div>


</div>


</nav>




<!-- ZONE PRINCIPALE -->

<main class="content">


    <div class="language-bar">

    <label>De :</label>

    <select id="langueSource">

        <option value="fr">Français</option>

        <option value="en">English</option>

        <option value="it">Italian</option>

        <option value="de">Deutsch (Schweiz)</option>

        <option value="es">Espagnol</option>

    </select>

    <span>→</span>

    <label>Vers :</label>

    <select id="langueCible">

        <option value="it">Italian</option>

        <option value="fr">Français</option>

        <option value="en">English</option>

        <option value="de">Deutsch (Schweiz)</option>

        <option value="es">Espagnol</option>

    </select>

</div>

<div class="titre-selection" id="titreSelection">

Choisir une catégorie

</div>


<div class="card" id="card">


<div class="card-inner">


<div class="face front" id="front">

Choisir une catégorie

</div>


<div class="face back" id="back">

...

</div>


</div>


</div>




<div class="controls">


<button onclick="precedent()">

← Précédent

</button>


<button onclick="suivant()">

Suivant →

</button>


</div>




<div class="audio-buttons">

<button onclick="prononcerCarte()">

🔊 Prononciation

</button>

</div>




<div class="counter" id="counter">

</div>

<div class="shortcuts">

<p>
<strong>Raccourcis clavier :</strong>
</p>

<p>
← Précédent &nbsp; | &nbsp;
→ Suivant &nbsp; | &nbsp;
↓ Retourner la carte &nbsp; | &nbsp;
↑ Audio
</p>

</div>

</div>

</main>



</div>



<script src="js/data/chiffres.js"></script>
<script src="js/data/vetements.js"></script>
<script src="js/data/directions.js"></script>

    <script src="js/data/verbes/etre.js"></script>
    <script src="js/data/verbes/avoir.js"></script>

<script src="js/data/verbes.js"></script>

<script src="js/data/catalogue.js"></script>

<script src="js/app.js"></script>


</body>

</html>
